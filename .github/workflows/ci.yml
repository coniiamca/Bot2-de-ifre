name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests infra
          uv run ruff format --check src tests infra
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  monitoring-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: "3.5.0"
      AM_VERSION: "0.28.1"
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool and amtool
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" | tar xz
      - name: Check alert rules and run alert unit tests
        run: |
          ./prometheus-${PROM_VERSION}.linux-amd64/promtool check rules infra/prometheus/rules/*.yml
          ./prometheus-${PROM_VERSION}.linux-amd64/promtool test rules infra/prometheus/tests/*.yml
      - name: Check Alertmanager config
        run: ./alertmanager-${AM_VERSION}.linux-amd64/amtool check-config infra/alertmanager/alertmanager.example.yml
      - name: Dashboard JSON is generated from source
        run: |
          python3 infra/grafana/generate_recorder_dashboard.py
          git diff --exit-code infra/grafana/dashboards

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: quanta:ci
          load: true
      - name: Smoke test image
        run: docker run --rm quanta:ci --help

  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -q shellcheck
          shellcheck --severity=style deploy/*.sh
      - name: Compose file (dev defaults, server env file, monitoring profile)
        working-directory: infra/compose
        run: |
          docker compose config -q
          docker compose --profile monitoring config -q
          printf 'QUANTA_CONFIG=/etc/quanta/recorder.yaml\nQUANTA_DATA=/var/lib/quanta/data\nQUANTA_SECRETS=/etc/quanta/secrets\n' > "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" config -q
          test "$(docker compose config --services | sort | tr '\n' ' ')" = "lake-daily recorder ui "
      - name: bootstrap --check-only (changes nothing)
        run: bash deploy/bootstrap.sh --check-only

  # The real thing on a fresh Ubuntu 24.04 VM: install from this commit, check the stack,
  # then re-run (idempotent update). Tailscale is skipped (needs a human login). The runner
  # is in a region the exchanges geo-block, so the access check is expected to report that.
  deploy-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [deploy-smoke]
    env:
      QUANTA_BRANCH: ci-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: Install with deploy/bootstrap.sh
        run: |
          git checkout -q -B "$QUANTA_BRANCH"
          sudo git config --system --add safe.directory '*'
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --no-tailscale
      - name: Stack is up, status page answers, access result is shown
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/status > status.json
          python3 - <<'PY'
          import json
          d = json.load(open("status.json"))
          print("verdict:", d["verdict"]["level"], [i["code"] for i in d["verdict"]["issues"]])
          access = d["access"]
          assert access and set(access["venues"]) == {"binance_usdm", "bybit_linear", "deribit"}, access
          for v, r in access["venues"].items():
              print(v, "ok" if r["ok"] else ("restricted" if r["restricted"] else "failed"), r["error"])
          PY
          sudo quanta-compose ps
          sudo stat -c '%U:%G %a %n' /var/lib/quanta/data /etc/quanta/secrets /etc/quanta/recorder.yaml
          test "$(sudo stat -c '%U:%G' /var/lib/quanta/data)" = quanta:quanta
          sudo grep -q '^host_id:' /etc/quanta/recorder.yaml
      - name: Re-run is a safe update
        run: |
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --no-tailscale
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Operator commands
        run: |
          sudo bash deploy/bootstrap.sh --check-access
          sudo quanta data volume -d /var/lib/quanta/data
      - name: Fresh config with --lite --min-free-gb reaches the recorder
        run: |
          sudo rm /etc/quanta/recorder.yaml
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --no-tailscale --lite --min-free-gb 3
          sudo grep -qx 'min_free_disk_gb: 3' /etc/quanta/recorder.yaml
          sudo grep -q '^  depth_symbols: \[BTCUSDT, ETHUSDT\]' /etc/quanta/recorder.yaml
          sudo quanta-compose up -d --force-recreate recorder lake-daily
          m=""
          for _ in $(seq 1 30); do
            m=$(sudo quanta-compose exec -T ui python -c "import urllib.request; print(urllib.request.urlopen('http://recorder:9101/metrics', timeout=3).read().decode())" 2>/dev/null || true)
            grep -q '^quanta_recorder_disk_floor_bytes 3e+09' <<<"$m" && break
            sleep 2
          done
          grep '^quanta_recorder_disk_' <<<"$m"
          grep -q '^quanta_recorder_disk_floor_bytes 3e+09' <<<"$m"
          grep -q '^quanta_recorder_disk_guard_active 0.0' <<<"$m"
      - name: Diagnostics
        if: failure()
        run: |
          sudo quanta-compose ps -a || true
          sudo quanta-compose logs --no-color --tail 200 || true
          sudo cat /var/log/quanta-bootstrap.log || true

  # Docker-free install (systemd) on a server whose Docker is stopped: the default mode must
  # refuse to start it, --native must install without ever touching it.
  deploy-e2e-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [deploy-smoke]
    env:
      QUANTA_BRANCH: ci-bootstrap
    steps:
      - uses: actions/checkout@v4
      - name: A stopped Docker is never started without consent
        run: |
          sudo systemctl stop docker.socket docker.service
          if bash deploy/bootstrap.sh --check-only > pre.txt 2>&1; then
            cat pre.txt; echo "expected a preflight obstacle for the stopped Docker"; exit 1
          fi
          grep -q -- '--native' pre.txt
          bash deploy/bootstrap.sh --check-only --native --lite --min-free-gb 3
      - name: Native install (systemd, no Docker)
        run: |
          git checkout -q -B "$QUANTA_BRANCH"
          sudo git config --system --add safe.directory '*'
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --no-tailscale --native --lite --min-free-gb 3
      - name: Services up, Docker untouched, metrics on loopback only
        run: |
          systemctl is-active quanta-recorder quanta-ui quanta-lake
          test "$(systemctl is-active docker || true)" != active
          curl -fsS http://127.0.0.1:8080/healthz
          python3 - <<'PY'
          import json, time, urllib.request
          deadline = time.time() + 60
          while True:  # the page scrapes the recorder every 10 s; wait for the first scrape
              d = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/status"))
              if d["system"].get("disk_floor_gb") is not None or time.time() > deadline:
                  break
              time.sleep(2)
          print("verdict:", d["verdict"]["level"], [i["code"] for i in d["verdict"]["issues"]])
          assert set(d["access"]["venues"]) == {"binance_usdm", "bybit_linear", "deribit"}
          assert d["system"]["disk_floor_gb"] == 3.0, d["system"]
          assert d["system"]["disk_guard_active"] is False, d["system"]
          PY
          m=""
          for _ in $(seq 1 30); do
            m=$(curl -fsS http://127.0.0.1:9101/metrics || true)
            grep -q '^quanta_recorder_disk_floor_bytes 3e+09' <<<"$m" && break
            sleep 2
          done
          grep -q '^quanta_recorder_disk_floor_bytes 3e+09' <<<"$m"
          ss -ltnH 'sport = :9101' | tee listen.txt
          test -z "$(grep -v '127.0.0.1:9101' listen.txt || true)"
          sudo grep -qx 'data_dir: /var/lib/quanta/data' /etc/quanta/recorder.yaml
          sudo grep -qx 'QUANTA_MODE=native' /etc/quanta/compose.env
          test ! -e /usr/local/bin/quanta-compose
          systemd-analyze verify /etc/systemd/system/quanta-*.service
          sudo quanta data volume -d /var/lib/quanta/data
      - name: Re-run remembers native mode and is a safe update
        run: |
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --no-tailscale
          systemctl is-active quanta-recorder quanta-ui quanta-lake
          test "$(systemctl is-active docker || true)" != active
          sudo bash deploy/bootstrap.sh --check-access
      - name: Auto-update deploys only CI-green commits and rolls back broken ones
        run: |
          set -x
          sudo QUANTA_REPO_URL="file://$GITHUB_WORKSPACE" QUANTA_BRANCH="$QUANTA_BRANCH" \
            bash deploy/bootstrap.sh --yes --auto-update on
          systemctl is-enabled quanta-update.timer
          sudo grep -qx 'QUANTA_AUTO_UPDATE=on' /etc/quanta/compose.env
          sudo grep -qx 'QUANTA_TAILSCALE=off' /etc/quanta/compose.env   # remembered
          # a fake GitHub API answering check-run queries
          api="$RUNNER_TEMP/api"; repo=coniiamca/Bot2-de-ifre; mkdir -p "$api"
          (cd "$api" && nohup python3 -m http.server 8799 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          checks() { mkdir -p "$api/repos/$repo/commits/$1"; printf '%s' "$2" > "$api/repos/$repo/commits/$1/check-runs"; }
          upd() { sudo QUANTA_GITHUB_API=http://127.0.0.1:8799 bash /opt/quanta/deploy/auto-update.sh; }
          # the data directory is 0750 quanta:quanta by design; the status page reads it as quanta
          result() { sudo python3 -c 'import json; print(json.load(open("/var/lib/quanta/data/update.json"))["result"])'; }
          deployed() { git -C /opt/quanta rev-parse HEAD; }
          green='{"check_runs":[{"status":"completed","conclusion":"success"}]}'
          git config user.name ci; git config user.email ci@example.invalid

          upd; test "$(result)" = up_to_date

          git commit -q --allow-empty -m "ci: update A"; A=$(git rev-parse HEAD)
          checks "$A" '{"check_runs":[{"status":"in_progress","conclusion":null}]}'
          upd; test "$(result)" = waiting_ci; test "$(deployed)" != "$A"
          checks "$A" "$green"
          upd; test "$(result)" = updated; test "$(deployed)" = "$A"
          systemctl is-active quanta-recorder quanta-ui quanta-lake
          # the running code is the checked-out code (not a stale build)
          site=/opt/quanta/.venv/lib/python3.12/site-packages/quanta
          installed_is_checkout() { cmp /opt/quanta/src/quanta/ui/app.py "$site/ui/app.py"; }
          installed_is_checkout

          # breaks the status page on start; CI "green" → deployed, fails, rolled back
          sed -i '1i raise SystemExit("broken on purpose")' src/quanta/ui/app.py
          git commit -qam "ci: broken B"; B=$(git rev-parse HEAD)
          checks "$B" "$green"
          upd; test "$(result)" = failed_rolled_back; test "$(deployed)" = "$A"
          systemctl is-active quanta-recorder quanta-ui quanta-lake
          installed_is_checkout
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/status > st.json && break; sleep 2; done
          python3 -c 'import json; d=json.load(open("st.json")); assert any(i["code"]=="update_failed" for i in d["verdict"]["issues"]), d["verdict"]'

          upd; test "$(result)" = skipped_failed; test "$(deployed)" = "$A"

          git revert --no-edit HEAD -q; C=$(git rev-parse HEAD)
          checks "$C" '{"check_runs":[{"status":"completed","conclusion":"failure"}]}'
          upd; test "$(result)" = ci_failed; test "$(deployed)" = "$A"
      - name: Diagnostics
        if: failure()
        run: |
          sudo journalctl -u quanta-recorder -u quanta-ui -u quanta-lake --no-pager -n 150 || true
          sudo cat /var/log/quanta-bootstrap.log || true
          sudo cat /var/log/quanta-update.log || true
