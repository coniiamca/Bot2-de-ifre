# quanta recorder — "lite" configuration for a small or shared server
# (`deploy/bootstrap.sh --lite`): L2 order books only for BTC and ETH, a 10-symbol universe,
# and a 20 GB disk-guard floor so the recorder never takes the disk away from other services.
# Measure GB/day on the status page, then widen. Otherwise identical to recorder.example.yaml
# (copy to config/recorder.local.yaml for local use; *.local.yaml is git-ignored).
# No secrets belong in this file: S3 credentials come from the standard AWS
# credential chain (e.g. a mounted AWS_SHARED_CREDENTIALS_FILE), see docs/runbooks/recorder.md.

data_dir: /var/lib/quanta/data
min_free_disk_gb: 20              # disk guard: recording stops below this much free space

binance_usdm:
  enabled: true
  environment: production        # production | demo
  # Full L2 diff depth @100ms + REST snapshots — the largest data volume. Start small and
  # widen after measuring GB/day (`quanta data volume`).
  depth_symbols: [BTCUSDT, ETHUSDT]
  depth_speed_ms: 100
  snapshot_limit: 1000
  # aggTrade + bookTicker + markPrice@1s + kline_1m (+ REST OI/stats polls) for each symbol.
  universe: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, BNBUSDT, ADAUSDT, LINKUSDT,
             AVAXUSDT, LTCUSDT]
  record_force_orders: true      # sampled by Binance: ≤1 liquidation/symbol/second
  streams_per_connection: 200
  max_weight_fraction: 0.5       # never use more than half of the 2400/min IP weight
  pollers:
    server_time_s: 30
    exchange_info_s: 3600
    funding_info_s: 3600
    premium_index_s: 30
    open_interest_s: 30
    stats_s: 300                 # OI/long-short stats: the REST API keeps only 30 days
    insurance_balance_s: 3600
    depth_audit_s: 600           # periodic snapshots for `quanta data book-audit`

# Bybit linear perps — complete liquidation feed (allLiquidation) + L2 50 @20ms.
bybit_linear:
  enabled: true
  book_symbols: [BTCUSDT]
  book_depth: 50
  universe: [BTCUSDT, ETHUSDT]
  ping_interval_s: 20

# Deribit perps — trades carry a liquidation flag (complete); DVOL implied-volatility index.
deribit:
  enabled: true
  instruments: [BTC-PERPETUAL]
  book_interval: 100ms
  volatility_indices: [btc_usd]
  heartbeat_s: 30

segments:
  rotate_s: 3600
  flush_interval_s: 1.0
  zstd_level: 3
  fsync: true

ws:
  max_age_s: 82800               # rotate (make-before-break) after 23h; server limit is 24h
  overlap_s: 5
  idle_timeout_s: 60
  heartbeat_s: 20

uploader:
  enabled: false
  target: s3                     # s3 | local
  s3_bucket: my-quanta-raw
  s3_prefix: quanta
  s3_endpoint_url: null          # set for non-AWS S3-compatible storage
  scan_interval_s: 60
  local_retention_days: 14

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9101

logging:
  level: INFO
  json_output: true
