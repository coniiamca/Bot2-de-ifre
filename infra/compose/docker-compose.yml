# quanta production stack (Phase 0: recorder + monitoring).
#
#   cp config/recorder.example.yaml config/recorder.local.yaml       # edit
#   cp infra/alertmanager/alertmanager.example.yml infra/alertmanager/alertmanager.yml
#   mkdir -p secrets && (umask 077; echo "<telegram bot token>" > secrets/telegram_bot_token)
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#
# Nothing listens on a public interface: UIs bind to 127.0.0.1 and are reached over
# WireGuard/Tailscale or an SSH tunnel (ADR-007). See docs/runbooks/recorder.md.
name: quanta

services:
  recorder:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: quanta:latest
    command: ["recorder", "run", "--config", "/etc/quanta/recorder.yaml"]
    restart: unless-stopped
    stop_grace_period: 60s          # flush + finalize segments on SIGTERM
    volumes:
      - quanta-data:/var/lib/quanta/data
      - ../../config/recorder.local.yaml:/etc/quanta/recorder.yaml:ro
    secrets:
      - source: aws_credentials
        target: aws_credentials
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    networks: [quanta]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "10"}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.listen-address=:9090
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [quanta]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - source: telegram_bot_token
        target: telegram_bot_token
    ports: ["127.0.0.1:9093:9093"]
    networks: [quanta]

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
    ports: ["127.0.0.1:3000:3000"]
    networks: [quanta]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [quanta]

volumes:
  quanta-data:
  prometheus-data:
  grafana-data:

networks:
  quanta:

secrets:
  aws_credentials:
    file: ../../secrets/aws_credentials
  telegram_bot_token:
    file: ../../secrets/telegram_bot_token
  grafana_admin_password:
    file: ../../secrets/grafana_admin_password
