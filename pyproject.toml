[project]
name = "quanta"
version = "0.1.0"
description = "Research-first crypto perpetual futures trading platform (data capture, research, simulation, execution, risk)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "aiohttp>=3.10",
    "msgspec>=0.18",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "zstandard>=0.23",
    "typer>=0.12",
    "uvloop>=0.20; sys_platform == 'linux'",
    "pyarrow>=17",
    "cryptography>=43",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
# research/backtest (quanta.research): not installed on the recording server
research = ["numpy>=2", "lightgbm>=4.3"]

[project.scripts]
quanta = "quanta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quanta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "RET"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "RUF001", "RUF002", "RUF003",  # Turkish/unicode text in strings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["quanta"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["zstandard.*", "boto3.*", "botocore.*", "uvloop.*", "pyarrow.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires network access to real exchanges (skipped unless QUANTA_LIVE_TESTS=1)",
    "slow: research pipeline self-tests on synthetic markets (tens of seconds)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
